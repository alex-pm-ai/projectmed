# Alternativa ao MariaDB instalado no Windows: sobe o mesmo banco via Docker.
services:
  mariadb:
    image: mariadb:11.4
    container_name: projectmed-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: projectmed
      MARIADB_USER: projectmed
      MARIADB_PASSWORD: projectmed
    ports:
      - "3306:3306"
    volumes:
      - projectmed_data:/var/lib/mysql

volumes:
  projectmed_data:
